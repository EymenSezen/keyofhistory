version: '3.8'

services:
  # 1. React Frontend
  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/keyofhistory-frontend:latest
    container_name: keyofhistory-frontend-prod
    restart: always
    networks:
      - keyofhistory-prod-network

  # 2. Caddy Server (Automated HTTPS / SSL Reverse Proxy)
  caddy:
    image: caddy:2-alpine
    container_name: keyofhistory-caddy-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    networks:
      - keyofhistory-prod-network

networks:
  keyofhistory-prod-network:
    name: keyofhistory-prod-network

volumes:
  caddy_data:
  caddy_config:
