# H2 In-Memory DB configuration
spring.datasource.url=jdbc:h2:mem:keyofhistorydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# H2 Console enable (allows viewing DB in browser at http://localhost:8080/h2-console)
# Similar to enabling Swagger UI for local development in .NET Core
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA/Hibernate properties (similar to EF Core logging and migration strategies)
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==============================================================================
# RabbitMQ Local Default Configuration
# ==============================================================================
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# ==============================================================================
# Redis Local Default Configuration
# ==============================================================================
spring.data.redis.host=localhost
spring.data.redis.port=6379

