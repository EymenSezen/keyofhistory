apiVersion: v1
kind: Pod
metadata:
  name: debug-node
  namespace: keyofhistory-test
spec:
  hostPID: true
  hostNetwork: true
  containers:
    - name: debug
      image: alpine
      securityContext:
        privileged: true
      command: ["nsenter", "--target", "1", "--mount", "--uts", "--ipc", "--net", "sleep", "infinity"]
      volumeMounts:
        - name: temp-dir
          mountPath: /tmp/transfer
  volumes:
    - name: temp-dir
      hostPath:
        path: /tmp
        type: Directory
