apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: keyofhistory-prod
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi # Larger volume for production database
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: keyofhistory-prod
type: Opaque
stringData:
  postgres-password: "postgres-strong-password-prod" # Production strong password
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: keyofhistory-prod
  labels:
    app: postgres
spec:
  replicas: 1 # Standard single instance replica for Postgres unless using multi-master or Stolon
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "250m"
              memory: "256Mi"
          env:
            - name: POSTGRES_DB
              value: keyofhistory
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: postgres-password
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: keyofhistory-prod
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: postgres
  type: ClusterIP
