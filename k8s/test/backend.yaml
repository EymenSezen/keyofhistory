apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: keyofhistory-test
data:
  SPRING_PROFILES_ACTIVE: "prod"
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_NAME: "keyofhistory"
  DB_USER: "postgres"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  RABBITMQ_HOST: "rabbitmq"
  RABBITMQ_PORT: "5672"
  SPRING_MAIL_HOST: "smtp.ethereal.email"
  SPRING_MAIL_PORT: "587"
  SPRING_MAIL_SMTP_AUTH: "true"
  SPRING_MAIL_STARTTLS_ENABLE: "true"
  SPRING_MAIL_STARTTLS_REQUIRED: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: keyofhistory-test
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          # Using local docker daemon image name directly for Docker Desktop K8s compatibility
          image: keyofhistory-backend:latest #burası dockerfile'da oluşturulan imaj isminin aynısı olmalı
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: backend-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: postgres-password
            - name: SPRING_MAIL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: smtp-secret
                  key: smtp-username
            - name: SPRING_MAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smtp-secret
                  key: smtp-password
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: keyofhistory-test
spec:
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: backend
  type: ClusterIP
---
apiVersion: v1
kind: Secret
metadata:
  name: smtp-secret
  namespace: keyofhistory-test
type: Opaque
stringData:
  smtp-username: "i3z3ag3aato2ujwj@ethereal.email"
  smtp-password: "ABAGHQXrMgK5D3P8CE"

