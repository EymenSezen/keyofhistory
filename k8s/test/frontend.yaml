apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: keyofhistory-test
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: keyofhistory-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: keyofhistory-test
spec:
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080 # Exposes React UI on http://localhost:30080 on Docker Desktop
  selector:
    app: frontend
  type: NodePort
