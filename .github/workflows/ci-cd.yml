name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - justmap
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - justmap

permissions:
  contents: write
  packages: write

jobs:
  # -------------------------------------------------------------
  # Job 1: Build & Lint React Frontend
  # -------------------------------------------------------------
  build-test-frontend:
    name: Build & Lint Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Frontend
        run: |
          cd frontend
          npm run build

  # -------------------------------------------------------------
  # Job 2: Build & Push Docker Image + Update K8s Manifests (CD)
  # -------------------------------------------------------------
  deploy:
    name: Package & Deploy (CD)
    needs: [build-test-frontend]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/justmap' || startsWith(github.ref, 'refs/tags/v'))
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Image Tags
        id: meta
        run: |
          # Convert username/owner to lowercase to comply with GHCR naming rules
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner_lc=${OWNER_LC}" >> $GITHUB_OUTPUT
          
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            # Tagged release (Prod)
            TAG="${{ github.ref_name }}"
            IS_PROD="true"
          else
            # Push to main (Test)
            TAG="sha-${{ github.sha }}"
            IS_PROD="false"
          fi
          
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "is_prod=${IS_PROD}" >> $GITHUB_OUTPUT

      # Build and Push Frontend
      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner_lc }}/keyofhistory-frontend:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ steps.meta.outputs.owner_lc }}/keyofhistory-frontend:${{ steps.meta.outputs.is_prod == 'true' && 'prod-latest' || 'latest' }}

      # Update Kubernetes Manifests (GitOps-style update)
      - name: Update K8s Manifests
        run: |
          OWNER="${{ steps.meta.outputs.owner_lc }}"
          TAG="${{ steps.meta.outputs.tag }}"
          
          if [ "${{ steps.meta.outputs.is_prod }}" = "true" ]; then
            echo "Updating Production manifests with tag ${TAG}..."
            sed -i "s|image: .*keyofhistory-frontend.*|image: ghcr.io/${OWNER}/keyofhistory-frontend:${TAG}|g" k8s/prod/frontend.yaml
          else
            echo "Updating Test manifests with tag ${TAG}..."
            sed -i "s|image: .*keyofhistory-frontend.*|image: ghcr.io/${OWNER}/keyofhistory-frontend:${TAG}|g" k8s/test/frontend.yaml
          fi

      - name: Commit and Push Manifest Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/
          git commit -m "chore: update K8s manifests image tag to ${{ steps.meta.outputs.tag }} [skip ci]" || echo "No changes to commit"
          
          # Push changes back to the main branch
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            # For tags, check out main, apply prod manifest changes, commit and push to main
            git checkout main
            OWNER="${{ steps.meta.outputs.owner_lc }}"
            TAG="${{ steps.meta.outputs.tag }}"
            sed -i "s|image: .*keyofhistory-frontend.*|image: ghcr.io/${OWNER}/keyofhistory-frontend:${TAG}|g" k8s/prod/frontend.yaml
            git add k8s/
            git commit -m "chore: update production manifests to version ${{ steps.meta.outputs.tag }} [skip ci]" || echo "No changes to commit"
            git push origin main
          else
            git push origin main
          fi
